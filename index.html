<script type="text/plain" id="py">import numpy as np

TAU = 2 * np.pi

# the ring stands upright. y is up, z comes toward the camera.
R_BAND = 1.00
TUBE = 0.092
GIRDLE_R = 0.34
GIRDLE_Y = 1.36
TABLE_R = 0.175
TABLE_Y = 1.60
CULET_Y = 1.18

BAND, PRONG, GEM = 0, 1, 2
DRAW = (0.30, 5.60)   # the sweep runs slowly over the whole ring
TURN = 12.0           # one full turn, in seconds, once the drawing is done


def band():
    """a comfort-fit shank: a tube bent into a circle."""
    u = np.linspace(0, TAU, 380, endpoint=False)
    v = np.linspace(0, TAU, 32, endpoint=False)
    uu, vv = np.meshgrid(u, v, indexing="ij")
    spine = np.stack((R_BAND * np.cos(uu), R_BAND * np.sin(uu), np.zeros_like(uu)), axis=-1)
    radial = np.stack((np.cos(uu), np.sin(uu), np.zeros_like(uu)), axis=-1)
    side = np.array([0.0, 0.0, 1.0])
    n = np.cos(vv)[..., None] * radial + np.sin(vv)[..., None] * side
    return (spine + TUBE * n).reshape(-1, 3), n.reshape(-1, 3)


def diamond():
    """57 facets, each with its own flat normal (that is what makes it sparkle)"""
    P, N, F = [], [], []
    k = 0

    def facet(corners, n):
        nonlocal k
        u, v = [x.ravel() for x in np.meshgrid(np.linspace(0, 1, 16), np.linspace(0, 1, 16))]
        keep = u + v <= 1
        a, b, c = corners
        pts = a + (b - a) * u[keep, None] + (c - a) * v[keep, None]
        nn = n / np.linalg.norm(n)
        P.append(pts), N.append(np.tile(nn, (len(pts), 1))), F.append(np.full(len(pts), k))
        k += 1

    m = 16
    for i in range(m):
        a0, a1 = TAU * i / m, TAU * (i + 1) / m
        g0 = np.array([GIRDLE_R * np.cos(a0), GIRDLE_Y, GIRDLE_R * np.sin(a0)])
        g1 = np.array([GIRDLE_R * np.cos(a1), GIRDLE_Y, GIRDLE_R * np.sin(a1)])
        t0 = np.array([TABLE_R * np.cos(a0), TABLE_Y, TABLE_R * np.sin(a0)])
        t1 = np.array([TABLE_R * np.cos(a1), TABLE_Y, TABLE_R * np.sin(a1)])
        culet = np.array([0.0, CULET_Y, 0.0])
        crown = np.cross(g1 - g0, t0 - g0)
        crown *= np.sign(crown[1]) or 1
        facet((g0, g1, t0), crown)
        facet((g1, t1, t0), crown * [1, 1.15, 1])
        pav = np.cross(culet - g0, g1 - g0)
        pav *= -np.sign(pav[1]) or 1
        facet((g0, g1, culet), pav)
        facet((np.array([0.0, TABLE_Y, 0.0]), t0, t1), np.array([0.0, 1.0, 0.0]))
    return np.concatenate(P), np.concatenate(N), np.concatenate(F)


def prongs():
    P, N = [], []
    for i in range(4):
        a = TAU * (i + 0.5) / 4
        base = np.array([0.08 * np.cos(a), R_BAND + 0.02, 0.08 * np.sin(a)])
        tip = np.array([(GIRDLE_R + 0.015) * np.cos(a), TABLE_Y - 0.03, (GIRDLE_R + 0.015) * np.sin(a)])
        u, phi = [x.ravel() for x in np.meshgrid(np.linspace(0, 1, 36), np.linspace(0, TAU, 11))]
        d = (tip - base) / np.linalg.norm(tip - base)
        s = np.cross(d, [0.0, 0.0, 1.0]); s /= np.linalg.norm(s)
        w = np.cross(s, d)
        n = np.cos(phi)[:, None] * s + np.sin(phi)[:, None] * w
        P.append(base + u[:, None] * (tip - base) + n * 0.020), N.append(n)
    return np.concatenate(P), np.concatenate(N)


BAND_P, BAND_N = band()
GEM_P, GEM_N, GEM_F = diamond()
PRONG_P, PRONG_N = prongs()
RING_P = np.concatenate([BAND_P, PRONG_P, GEM_P])
RING_N = np.concatenate([BAND_N, PRONG_N, GEM_N])
RING_KIND = np.concatenate([
    np.full(len(BAND_P), BAND), np.full(len(PRONG_P), PRONG), np.full(len(GEM_P), GEM)
])
FACET = np.concatenate([
    np.full(len(BAND_P), -1), np.full(len(PRONG_P), -1), GEM_F
])
SEED = np.random.default_rng(1).random((len(RING_P), 3))


def lights(t):
    """a key light, a moving rim light, and a sparkle light"""
    key = np.array([0.0, 0.80, 0.60])
    rim = np.array([np.cos(t * 0.9), 0.50, np.sin(t * 0.9)])
    spark = np.array([np.sin(t * 1.7), 0.25, np.cos(t * 1.3)])
    return key / np.linalg.norm(key), rim / np.linalg.norm(rim), spark / np.linalg.norm(spark)


def spin(t):
    return TAU * max(t - DRAW[1] - 0.6, 0) / TURN  # starts after the drawing


def rot_y(p, a):
    c, s = np.cos(a), np.sin(a)
    return np.stack((c * p[:, 0] + s * p[:, 2], p[:, 1], -s * p[:, 0] + c * p[:, 2]), axis=1)


def draw_order():
    """when each point appears: the band draws itself from the bottom up,
    then the prongs rise, then the diamond fills in from its tip"""
    p = RING_P
    up_band = np.abs(np.angle(np.exp(1j * (np.arctan2(p[:, 1], p[:, 0]) + np.pi / 2)))) / np.pi
    prong = 1.0 + (p[:, 1] - R_BAND) / (TABLE_Y - R_BAND) * 0.25
    gem = 1.25 + (p[:, 1] - CULET_Y) / (TABLE_Y - CULET_Y) * 0.45
    return np.select([RING_KIND == BAND, RING_KIND == PRONG], [up_band, prong], gem)


ORDER = draw_order()


def smooth(x):
    x = np.clip(x, 0.0, 1.0)
    return x * x * (3.0 - 2.0 * x)


def gather(t):
    """sweep: points appear where the drawing light has passed"""
    head = (t - DRAW[0]) / (DRAW[1] - DRAW[0]) * float(ORDER.max())
    k = smooth((head - ORDER) / 0.055)
    return k, np.exp(-np.abs(head - ORDER) / 0.030)

      }
      const lid = cells[i];
      if (lid < 0) continue;
      const tone = 1 - Math.exp(-Math.max(lum[i], 0) * 0.75);
      if (tone < 0.08) continue;
      const v = (90 + 165 * tone) | 0;
      ctx.fillStyle = `rgb(${v},${(v * 0.98) | 0},${Math.min(255, (v * 1.05) | 0)})`;
      ctx.fillText(LETTERS[lid], c * CW + 1, r * CH - 1);
      letters++;
    }
  }

  const hot = [];
  for (let f = 0; f < 80; f++) if (fCnt[f] && fScore[f] / fCnt[f] > 0.22) hot.push(f);
  hot.sort((a, b) => fScore[b] / fCnt[b] - fScore[a] / fCnt[a]);
  for (const f of hot.slice(0, 5)) starLetters(fX[f], fY[f], 0.8 + 2.2 * (fScore[f] / fCnt[f]), fLid[f]);

  for (let i = 0; i < DUST.length; i++) {
    const d = DUST[i];
    const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 1.8 + d[0] * 40));
    if (tw < 0.45) continue;
    const v = (55 + 70 * tw) | 0;
    ctx.fillStyle = `rgb(${v},${v},${(v * 1.05) | 0})`;
    ctx.fillText(LETTERS[i % 4], (d[0] * (W - 40) + 20) | 0, (d[1] * (H * 0.68) + 12) | 0);
  }
  return hot.length * 17 + (letters >> 3);
}

const KW = new Set(["def", "for", "in", "return", "nonlocal", "import", "from", "as"]);
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
const STRING_LINE = (() => {
  const on = [];
  let cur = false;
  for (let i = 0; i < LINES.length; i++) {
    const n = (LINES[i].match(/"""/g) || []).length;
    const entered = cur;
    if (n % 2) cur = !cur;
    on[i] = entered || n > 0;
  }
  return on;
})();
function color(line, idx) {
  if (STRING_LINE[idx] || /^\s*#/.test(line)) return `<span class="s">${esc(line)}</span>`;
  let html = "", i = 0;
  while (i < line.length) {
    const ch = line[i];
    if (ch === "#") { html += `<span class="s">${esc(line.slice(i))}</span>`; break; }
    if (ch === '"' || ch === "'") {
      let j = i + 1; while (j < line.length && line[j] !== ch) j++; j = Math.min(line.length, j + 1);
      html += `<span class="s">${esc(line.slice(i, j))}</span>`; i = j; continue;
    }
    if (ch >= "0" && ch <= "9" || (ch === "." && line[i + 1] >= "0" && line[i + 1] <= "9")) {
      let j = i + 1; while (j < line.length && (line[j] >= "0" && line[j] <= "9" || line[j] === ".")) j++;
      html += `<span class="n">${esc(line.slice(i, j))}</span>`; i = j; continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      let j = i + 1; while (j < line.length && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w = line.slice(i, j);
      const cls = KW.has(w) ? "k" : (w === "np" ? "b" : "p");
      html += `<span class="${cls}">${esc(w)}</span>`; i = j; continue;
    }
    html += `<span class="p">${esc(ch)}</span>`; i++;
  }
  return html;
}
const codeEl = document.getElementById("code");
let lastShown = -1;
function lettersOf(t) {
  const n = SOURCE.length, done = 8.4;
  if (t >= done) return n;
  const u = Math.max(t, 0) / done;
  return Math.floor(n * (1 - (1 - u) ** 0.72));
}
function fmtLetters(n) { const s = String(n).padStart(4, "0"); return s.slice(0, -3) + "," + s.slice(-3); }
function showCode(t) {
  const shown = lettersOf(t);
  if (shown === lastShown) return;
  lastShown = shown;
  const text = SOURCE.slice(0, shown);
  const parts = text.split("\n");
  let current, col;
  if (text.endsWith("\n")) { current = parts.length - 2; col = (parts[current] || "").length; parts.pop(); }
  else { current = parts.length - 1; col = parts[current].length; }
  current = Math.max(0, current);
  const start = Math.max(0, current - 7);
  let html = "";
  for (let row = start; row < Math.min(LINES.length, start + 9); row++) {
    const raw = row < parts.length ? parts[row] : (row === current ? "" : null);
    if (raw === null) break;
    const on = row === current;
    let body = color(raw, row);
    if (on) body = color(raw.slice(0, col), row) + `<span class="cur"></span>` + color(raw.slice(col), row);
    html += `<div class="row${on ? " on" : ""}"><span class="ln">${row + 1}</span>${body}</div>`;
  }
  codeEl.innerHTML = html;
  document.getElementById("letters").textContent = fmtLetters(shown);
}

const timeEl = document.querySelector("#time span");
const rotEl = document.getElementById("rot");
const glintEl = document.getElementById("glints");
let t0 = performance.now();
const params = new URLSearchParams(location.search);
const pinned = params.has("t") ? parseFloat(params.get("t")) : null;
function loop(now) {
  const t = pinned === null ? ((now - t0) / 1000) % 24 : pinned;
  const g = frame(t);
  const deg = ((t - DRAW1 - 0.6) > 0 ? ((t - DRAW1 - 0.6) / TURN) * 360 : 0) % 360;
  timeEl.textContent = "t " + t.toFixed(2).padStart(5, "0") + "s";
  rotEl.textContent = deg.toFixed(2).padStart(6, "0");
  glintEl.textContent = String(g);
  showCode(t);
  if (pinned === null) requestAnimationFrame(loop);
}
addEventListener("pointerdown", () => { if (pinned === null) { t0 = performance.now(); lastShown = -1; } });
requestAnimationFrame(loop);
</script>
